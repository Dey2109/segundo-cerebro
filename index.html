<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segundo Cerebro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de login: se muestra mientras nadie ha iniciado sesión -->
  <div id="pantalla-login" style="display:flex;">
    <div class="login-card">
      <svg class="login-nodos" viewBox="0 0 120 60" aria-hidden="true">
        <line x1="20" y1="20" x2="60" y2="40" />
        <line x1="60" y1="40" x2="100" y2="15" />
        <line x1="60" y1="40" x2="80" y2="55" />
        <circle cx="20" cy="20" r="4" class="nodo-1" />
        <circle cx="60" cy="40" r="5" class="nodo-2" />
        <circle cx="100" cy="15" r="4" class="nodo-1" />
        <circle cx="80" cy="55" r="3" class="nodo-1" />
      </svg>
      <h1>Segundo Cerebro</h1>
      <p class="login-subtitulo">Guarda un link. La IA lo lee, lo resume, y encuentra con qué más se conecta.</p>
      <button id="btn-login">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
        Continuar con Google
      </button>
    </div>
  </div>

  <!-- App principal: se muestra solo si ya iniciaste sesión -->
  <div id="app-principal" style="display:none;">

    <header>
      <div class="barra-usuario">
        <div class="marca">
          <svg class="marca-nodos" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="5" y1="6" x2="12" y2="12" />
            <line x1="12" y1="12" x2="19" y2="7" />
            <line x1="12" y1="12" x2="15" y2="19" />
            <circle cx="5" cy="6" r="2" />
            <circle cx="12" cy="12" r="2.4" />
            <circle cx="19" cy="7" r="2" />
            <circle cx="15" cy="19" r="1.6" />
          </svg>
          <span>Segundo Cerebro</span>
        </div>
        <div class="usuario-controles">
          <div id="info-usuario"></div>
          <button id="btn-logout">Salir</button>
        </div>
      </div>
    </header>

    <main>
      <!-- Formulario para agregar un link nuevo -->
      <section class="agregar-link">
        <input type="url" id="input-url" placeholder="Pega un link aquí, ej: https://ejemplo.com" required>
        <input type="text" id="input-titulo" placeholder="Título (ej: Curso de JS moderno)">
        <select id="input-categoria">
          <option value="general">General</option>
          <option value="programacion">Programación</option>
          <option value="futbol">Fútbol</option>
          <option value="gaming">Gaming</option>
          <option value="estudio">Estudio / INFRAMEN</option>
          <option value="otro">Otro</option>
        </select>
        <button id="btn-guardar">Guardar link</button>
        <p id="aviso-duplicado" class="aviso-duplicado" style="display:none;"></p>
      </section>

      <div class="divisor-nodos" aria-hidden="true"><span></span><span></span><span></span></div>

      <!-- Digest semanal y vacíos de conocimiento -->
      <section class="digest-section">
        <h2><span class="eyebrow">Panorama</span>Tu resumen</h2>
        <div class="digest-botones">
          <button id="btn-digest">Digest de esta semana</button>
          <button id="btn-vacios">Vacíos de conocimiento</button>
        </div>
        <div id="resultado-digest"></div>
      </section>

      <!-- Chat con tu segundo cerebro -->
      <section class="chat-section">
        <h2><span class="eyebrow">Consulta</span>Pregúntale a tu segundo cerebro</h2>
        <div class="chat-input-row">
          <input type="text" id="input-pregunta" placeholder="Ej: ¿qué he guardado sobre fútbol?">
          <button id="btn-preguntar">Preguntar</button>
        </div>
        <div id="respuesta-chat"></div>
      </section>

      <div class="divisor-nodos" aria-hidden="true"><span></span><span></span><span></span></div>

      <!-- Mapa visual de conexiones entre links -->
      <section class="mapa-section">
        <button id="btn-toggle-mapa">Ver mapa de conexiones</button>
        <div id="mapa-container" style="display:none;">
          <svg id="grafo" width="100%" height="600"></svg>
        </div>
      </section>

      <!-- Aquí se van a mostrar los links guardados -->
      <section class="lista-links">
        <h2><span class="eyebrow">Archivo</span>Tus links guardados</h2>

        <div class="busqueda-row">
          <input type="text" id="input-busqueda" placeholder="Buscar por significado, ej: goles increíbles">
          <button id="btn-buscar">Buscar</button>
          <button id="btn-limpiar-busqueda" title="Ver todos de nuevo">✕</button>
        </div>

        <div id="contenedor-links">
          <p class="vacio">Todavía no has guardado ningún link. Pega uno arriba para empezar.</p>
        </div>
      </section>
    </main>

  </div>

  <!-- type="module" nos permite usar import/export de ES6 -->
  <!-- D3.js para el mapa visual de conexiones -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="toast.js"></script>
  <script type="module" src="auth-state.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="gemini-config.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="digest.js"></script>
  <script type="module" src="chat.js"></script>
  <script type="module" src="grafo.js"></script>
</body>
</html>
