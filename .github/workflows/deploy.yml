name: Desplegar a GitHub Pages

# Este workflow se ejecuta automáticamente cada vez que subes cambios a "main"
on:
  push:
    branches: [main]

# Permisos necesarios para que Actions pueda publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: descargar el código del repositorio
      - name: Descargar el código
        uses: actions/checkout@v4

      # Paso 2: crear gemini-config.js a partir de la plantilla,
      # reemplazando el texto de ejemplo por la clave real guardada en Secrets.
      # Esta clave NUNCA queda escrita en el repositorio, solo existe
      # temporalmente durante este proceso de despliegue.
      - name: Generar gemini-config.js con la clave real
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Usamos awk en vez de sed: awk recibe la clave como una variable
          # separada (-v), así que no importa qué caracteres tenga adentro
          # (/, #, etc.) — nunca se mezcla con la sintaxis del comando.
          # "xargs" limpia espacios o saltos de línea invisibles que a veces
          # quedan pegados al copiar/pegar un secret en GitHub.
          KEY_LIMPIA=$(echo -n "$GEMINI_API_KEY" | xargs)
          awk -v key="$KEY_LIMPIA" '{gsub("PEGA_AQUI_TU_PROPIA_CLAVE_DE_GEMINI", key); print}' gemini-config.example.js > gemini-config.js

          # Verificación: mostramos solo la LARGO de la clave generada (no la clave completa,
          # para no exponerla en los logs), así confirmamos que no quedó vacía ni cortada.
          echo "Longitud de la clave insertada: ${#KEY_LIMPIA} caracteres"

      # Paso 3: preparar los archivos para GitHub Pages
      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir los archivos como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Paso 4: publicar en GitHub Pages
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4